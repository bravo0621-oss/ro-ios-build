# r54_apk4（11/21）：下一服 SYROO 樹月仙境 iPhone 未簽章安裝檔（Unity 2019.4.36f1 匯出版）。放法：儲存庫 .github/workflows/build-ios.yml。
# 底＝r21_engine4 mac_kit2 版（11/14）；改：素材包與成品都放「草稿 Release」（不公開，只有有寫入權的人看得到），不用新主機網頁下載點、不用帳密機密。
# ★這是公開儲存庫：不用 actions/upload-artifact、不用 actions/cache（別人看得到／拿得到）；紀錄不印網址與權杖（下載上傳都經 tools/gh_rel.py，它不印網址）。
# 觸發：新主機 ios_up.sh 把素材包分卷傳成草稿 Release 後，用 gh_rel.py dispatch build-ios.yml <TAG> 觸發；跑完 ipa 分卷傳回同一個草稿 Release，新主機 ios_get.sh 取回後刪草稿。
name: build-ios
run-name: build-ios ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "草稿 Release 標籤（新主機 ios_up.sh 印的 TAG）"
        required: true
      ios_min:
        description: "最低 iOS"
        required: false
        default: "15.0"
permissions:
  contents: write
concurrency:
  group: build-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      RO_IOS_REPO: ${{ github.repository }}
      RO_TAG: ${{ inputs.tag }}
      IOS_MIN: ${{ inputs.ios_min }}
    steps:
      - name: 取工具（只拿 tools/）
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          persist-credentials: false
      - name: 選 Xcode 16（最新的 16.x）
        run: |
          X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "使用 ${X}"
          sudo xcode-select -s "${X}/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$HOME" | tail -1
      - name: 下載素材包分卷（草稿 Release）並組回
        run: |
          set -euo pipefail
          W="$HOME/ro_build"; mkdir -p "${W}/parts" "${W}/pkg"
          python3 tools/gh_rel.py download "${RO_TAG}" "${W}/parts" 'pkg.*'
          cd "${W}/parts"
          n=0
          while read -r h sz name; do
            [ "${h}" = "ALL" ] && continue
            got=$(shasum -a 256 "${name}" | awk '{print $1}')
            [ "${got}" = "${h}" ] || { echo "分卷 sha256 不對 ${name}"; exit 1; }
            n=$((n+1))
          done < pkg.manifest.txt
          echo "分卷 ${n} 個 sha256 全對"
          cat pkg.tar.part* | tar -xf - -C "${W}/pkg"
          rm -f pkg.tar.part*
          df -h "$HOME" | tail -1
      - name: 出包
        run: |
          set -euo pipefail
          W="$HOME/ro_build"
          RO_PKG="${W}/pkg" WORK="${W}" bash "${W}/pkg/kit/build_on_mac.sh"
      - name: ipa 分卷傳回草稿 Release
        run: |
          set -euo pipefail
          W="$HOME/ro_build"; O="${W}/up"; mkdir -p "${O}"
          IPA="${W}/out/ro_syroo_unsigned.ipa"
          cd "${O}"
          split -b 1900m "${IPA}" ipa.part
          : > ipa.manifest.txt
          for f in ipa.part*; do echo "$(shasum -a 256 "${f}" | awk '{print $1}') $(stat -f %z "${f}") ${f}" >> ipa.manifest.txt; done
          echo "ALL $(awk '{print $1}' "${IPA}.sha256") $(stat -f %z "${IPA}") ro_syroo_unsigned.ipa" >> ipa.manifest.txt
          cat ipa.manifest.txt
          python3 "${GITHUB_WORKSPACE}/tools/gh_rel.py" upload "${RO_TAG}" ipa.part* ipa.manifest.txt
      - name: 失敗時把紀錄傳回草稿 Release（只傳紀錄，不傳程式）
        if: failure()
        run: |
          W="$HOME/ro_build"; [ -d "${W}/logs" ] || exit 0
          cd "${W}" && tar -czf logs_fail.tgz logs 2>/dev/null || exit 0
          python3 "${GITHUB_WORKSPACE}/tools/gh_rel.py" upload "${RO_TAG}" logs_fail.tgz || true
